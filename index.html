function rowToOrder(row) {
  return {
    id: row.id,
    table: row.table_no,
    items: row.items || [],
    total: row.total,
    note: row.note || "",
    status: row.status,
    payment: row.payment,
    createdAt: row.created_at,
  };
}

async function fetchBoardOrders() {
  if (!sb) return [];
  const [{ data: active, error: e1 }, { data: served, error: e2 }] = await Promise.all([
    sb.from("orders").select("*").eq("status", "active").order("created_at", { ascending: true }),
    sb.from("orders").select("*").eq("status", "served").order("created_at", { ascending: false }).limit(10),
  ]);
  if (e1) console.error("讀取進行中訂單失敗", e1);
  if (e2) console.error("讀取已出餐訂單失敗", e2);
  return [...(active || []), ...(served || [])].map(rowToOrder);
}

/* 給顧客看自己這一桌點過什麼用的：只抓「這一桌」的訂單，不會看到其他桌的資料 */
async function fetchTableOrders(tableNo) {
  if (!sb || !tableNo) return [];
  const { data, error } = await sb
    .from("orders")
    .select("*")
    .eq("table_no", tableNo)
    .order("created_at", { ascending: false });
  if (error) console.error("讀取本桌訂單失敗", error);
  return (data || []).map(rowToOrder);
}

async function fetchReportOrders(startDate, endDate) {
  if (!sb) return [];
  const { data, error } = await sb
    .from("orders")
    .select("*")
    .gte("created_at", startDate.toISOString())
    .lte("created_at", endDate.toISOString());
  if (error) console.error("讀取報表失敗", error);
  return (data || []).map(rowToOrder);
}

/* 依「日／週／月」把某一天換算成報表要查的起訖時間範圍。週是週一到週日。 */
function reportRange(dateStr, period) {
  const d = new Date(`${dateStr}T00:00:00`);
  if (period === "week") {
    const day = d.getDay();
    const diffToMonday = (day === 0 ? -6 : 1) - day;
    const start = new Date(d);
    start.setDate(d.getDate() + diffToMonday);
    start.setHours(0, 0, 0, 0);
    const end = new Date(start);
    end.setDate(start.getDate() + 6);
    end.setHours(23, 59, 59, 999);
    return [start, end];
  }
  if (period === "month") {
    const start = new Date(d.getFullYear(), d.getMonth(), 1, 0, 0, 0, 0);
    const end = new Date(d.getFullYear(), d.getMonth() + 1, 0, 23, 59, 59, 999);
    return [start, end];
  }
  const start = new Date(d);
  const end = new Date(d);
  end.setHours(23, 59, 59, 999);
  return [start, end];
}

function fmtShortDate(d) {
  return `${d.getMonth() + 1}/${d.getDate()}`;
}

async function insertOrder(order) {
  if (!sb) return { error: new Error("Supabase 尚未設定") };
  const { error } = await sb.from("orders").insert([
    {
      id: order.id,
      table_no: order.table,
      status: order.status,
      payment: order.payment,
      total: order.total,
      note: order.note,
      items: order.items,
      created_at: order.createdAt,
    },
  ]);
  if (error) console.error("送出訂單失敗", error);
  return { error };
}

async function updateOrderItems(orderId, items) {
  if (!sb) return;
  const { error } = await sb.from("orders").update({ items }).eq("id", orderId);
  if (error) console.error("更新品項狀態失敗", error);
}
/* 內場修改訂單內容用：品項跟金額要一起改，避免總額跟實際品項對不起來 */
async function updateOrderItemsAndTotal(orderId, items, total) {
  if (!sb) return { error: new Error("Supabase 尚未設定") };
  const { error } = await sb.from("orders").update({ items, total }).eq("id", orderId);
  if (error) console.error("修改訂單內容失敗", error);
  return { error };
}
async function updateOrderStatus(orderId, status) {
  if (!sb) return;
  const { error } = await sb.from("orders").update({ status }).eq("id", orderId);
  if (error) console.error("更新訂單狀態失敗", error);
}
async function updateOrderPayment(orderId, payment) {
  if (!sb) return;
  const { error } = await sb.from("orders").update({ payment }).eq("id", orderId);
  if (error) console.error("更新付款方式失敗", error);
}
async function deleteOrder(orderId) {
  if (!sb) return { error: new Error("Supabase 尚未設定") };
  // Supabase 對於「RLS 政策沒開放刪除」這種情況不會回傳 error，
  // 而是刪除 0 筆、回傳成功 —— 所以要用 .select() 檢查有沒有真的刪到東西，
  // data 是空陣列就代表其實沒刪掉（多半是權限問題），要當成失敗處理。
  const { data, error } = await sb.from("orders").delete().eq("id", orderId).select();
  if (error) {
    console.error("刪除訂單失敗", error);
    return { error };
  }
  if (!data || data.length === 0) {
    const blocked = new Error("刪除失敗：可能是資料庫權限（RLS）還沒開放刪除，或這筆訂單已經不存在");
    console.error("刪除訂單失敗", blocked);
    return { error: blocked };
  }
  return { error: null };
}

/* 烤餅／飲品是「每人可以選不同的」，展開成一人一格（key 加上序號），其餘品項維持一格 */
function expandGroupSetSlots(set) {
  const out = [];
  set.slots.forEach((slot) => {
    if (slot.repeatPerPerson) {
      for (let i = 1; i <= set.people; i++) out.push({ ...slot, key: `${slot.key}${i}` });
    } else {
      out.push(slot);
    }
  });
  return out;
}
/* 同名同分類的品項（例如三個人都選蒜味烤餅）合併成一行，內場出單看板才不會出現三條一樣的東西 */
function mergeGroupSetLines(rawItems) {
  const map = new Map();
  rawItems.forEach((r) => {
    const key = `${r.cat}::${r.name}`;
    if (map.has(key)) map.get(key).qty += r.qty;
    else map.set(key, { ...r });
  });
  return Array.from(map.values());
}

/* 瀏覽器規定「使用者要先跟頁面互動過一次」才准許播放聲音，
   所以只能重複用同一個 AudioContext，且在使用者第一次點擊/觸控/按鍵時就先解鎖它，
   不然內場如果開著頁面完全沒點過任何東西，提示音會被瀏覽器悄悄擋掉、不會報錯也聽不到。 */
let sharedAudioCtx = null;
function getAudioCtx() {
  if (!sharedAudioCtx) {
    sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  return sharedAudioCtx;
}
function unlockAudioOnFirstInteraction() {
  const unlock = () => {
    const ctx = getAudioCtx();
    if (ctx.state === "suspended") ctx.resume();
    document.removeEventListener("click", unlock);
    document.removeEventListener("touchstart", unlock);
    document.removeEventListener("keydown", unlock);
  };
  document.addEventListener("click", unlock);
  document.addEventListener("touchstart", unlock);
  document.addEventListener("keydown", unlock);
  return () => {
    document.removeEventListener("click", unlock);
    document.removeEventListener("touchstart", unlock);
    document.removeEventListener("keydown", unlock);
  };
}

function beep() {
  try {
    const ctx = getAudioCtx();
    if (ctx.state === "suspended") ctx.resume();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g);
    g.connect(ctx.destination);
    o.type = "sine";
    o.frequency.value = 720;
    g.gain.setValueAtTime(0.15, ctx.currentTime);
    o.start();
    o.stop(ctx.currentTime + 0.12);
    setTimeout(() => {
      const o2 = ctx.createOscillator();
      o2.connect(g);
      o2.type = "sine";
      o2.frequency.value = 900;
      o2.start();
      o2.stop(ctx.currentTime + 0.24);
    }, 140);
  } catch {}
}

/* 多人套餐選項視窗：每一格都能換，換貴的補差額、換便宜的直接折，總金額即時更新；
   確認後拆成一般品項（咖哩／傳統料理／烤餅／主食／飲品分開），內場出單看板才看得到正確分類 */
function GroupSetModal({ set, onConfirm, onClose }) {
  const expandedSlots = expandGroupSetSlots(set);
  const [selections, setSelections] = useState(() => {
    const init = {};
    expandedSlots.forEach((slot) => { init[slot.key] = slot.defaultName; });
    return init;
  });
  const [curryTabs, setCurryTabs] = useState(() => {
    const init = {};
    expandedSlots.filter((s) => s.type === "curry").forEach((slot) => { init[slot.key] = proteinOfCurry(slot.defaultName); });
    return init;
  });

  const extrasTotal = expandedSlots.reduce((sum, slot) => {
    const baseline = findSlotOption(slot, slot.defaultName).price;
    const chosen = findSlotOption(slot, selections[slot.key]);
    return sum + (chosen.price - baseline);
  }, 0);
  const finalPrice = set.basePrice + extrasTotal;

  const handleConfirm = () => {
    const raw = expandedSlots.map((slot) => {
      const chosen = findSlotOption(slot, selections[slot.key]);
      return { name: chosen.name, price: chosen.price, cat: slot.cat, qty: 1 };
    });
    raw.push({ name: "泰香飯", price: 20, cat: "staple", qty: set.people });
    const merged = mergeGroupSetLines(raw);
    const lines = merged.map((m) => ({ id: `${set.id}-${m.cat}-${m.name}`, name: m.name, price: m.price, qty: m.qty, cat: m.cat }));
    const actualSum = lines.reduce((s, l) => s + l.price * l.qty, 0);
    const discount = finalPrice - actualSum;
    lines.push({ id: `${set.id}-discount-${Date.now()}`, name: `🎉 ${set.people}人套餐優惠`, price: discount, qty: 1, cat: "combo" });
    onConfirm(lines);
  };

  const mainSlots = set.slots.filter((s) => !s.repeatPerPerson);
  const personSlots = set.slots.filter((s) => s.repeatPerPerson);

  return (
    <div className="fixed inset-0 z-40 flex items-end sm:items-center justify-center p-0 sm:p-4" style={{ background: "rgba(59,46,34,.55)" }}>
      <div className="card w-full sm:max-w-lg p-5 slide-up" style={{ borderRadius: "16px 16px 0 0", maxHeight: "88vh", overflowY: "auto" }}>
        <div className="flex items-start justify-between mb-1">
          <div>
            <p className="text-xs opacity-60" style={{ color: "var(--ink)" }}>{set.people}人套餐．基本價 {fmt(set.basePrice)}</p>
            <h3 style={{ fontFamily: "var(--font-display)", color: "var(--maroon)" }} className="text-lg font-bold">選擇這桌想吃的品項</h3>
          </div>
          <button onClick={onClose} title="關閉" className="p-1 opacity-50"><X size={18} /></button>
        </div>
        <p className="text-xs mb-4" style={{ color: "var(--ink)", opacity: 0.7 }}>每一項都可以換，換比較貴的會加價、換比較便宜的直接折扣，選好按最下面加入購物車。</p>

        {mainSlots.map((slot) => {
          const baseline = findSlotOption(slot, slot.defaultName).price;
          const options = slot.type === "curry" ? GROUP_CURRY_OPTIONS[curryTabs[slot.key]] : slotOptionList(slot);
          return (
            <div key={slot.key} className="mb-4">
              <p className="text-xs font-semibold mb-1.5" style={{ color: "var(--ink)" }}>{slot.label}</p>
              {slot.type === "curry" && (
                <div className="flex gap-1 mb-1.5 flex-wrap">
                  {PROTEINS.map((p) => (
                    <button
                      key={p.id}
                      onClick={() => setCurryTabs((t) => ({ ...t, [slot.key]: p.id }))}
                      className="text-[11px] font-medium px-2 py-1 rounded-full border"
                      style={{ borderColor: curryTabs[slot.key] === p.id ? "var(--maroon)" : "var(--line)", background: curryTabs[slot.key] === p.id ? "var(--maroon)" : "transparent", color: curryTabs[slot.key] === p.id ? "var(--paper)" : "var(--ink)" }}
                    >
                      {p.label}
                    </button>
                  ))}
                </div>
              )}
              <div className="flex gap-1.5 flex-wrap">
                {options.map((opt) => {
                  const isSel = selections[slot.key] === opt.name;
                  const delta = opt.price - baseline;
                  return (
                    <button
                      key={opt.name}
                      onClick={() => setSelections((s) => ({ ...s, [slot.key]: opt.name }))}
                      className="text-[12px] font-medium px-2.5 py-1.5 rounded-full border flex items-center gap-1"
                      style={{ borderColor: isSel ? "var(--maroon)" : "var(--line)", background: isSel ? "var(--maroon)" : "transparent", color: isSel ? "var(--paper)" : "var(--ink)" }}
                    >
                      {opt.name}
                      {delta !== 0 && (
                        <span style={{ fontFamily: "var(--font-mono)", color: isSel ? "var(--paper)" : delta > 0 ? "var(--saffron)" : "var(--juniper)", opacity: isSel ? 0.9 : 1 }}>
                          {delta > 0 ? "+" : ""}{delta}
                        </span>
                      )}
                    </button>
                  );
                })}
              </div>
            </div>
          );
        })}

        {personSlots.map((slot) => {
          const baseline = findSlotOption(slot, slot.defaultName).price;
          const options = slotOptionList(slot);
          return (
            <div key={slot.key} className="mb-4">
              <p className="text-xs font-semibold mb-1.5" style={{ color: "var(--ink)" }}>{slot.label}口味（每位可以選不一樣的）</p>
              <div className="space-y-1.5">
                {Array.from({ length: set.people }, (_, i) => {
                  const pKey = `${slot.key}${i + 1}`;
                  return (
                    <div key={pKey} className="flex items-center gap-1.5 flex-wrap">
                      <span className="text-[11px] shrink-0 opacity-60" style={{ color: "var(--ink)", width: 40 }}>第{i + 1}位</span>
                      {options.map((opt) => {
                        const isSel = selections[pKey] === opt.name;
                        const delta = opt.price - baseline;
                        return (
                          <button
                            key={opt.name}
                            onClick={() => setSelections((s) => ({ ...s, [pKey]: opt.name }))}
                            className="text-[11px] font-medium px-2 py-1 rounded-full border flex items-center gap-1"
                            style={{ borderColor: isSel ? "var(--maroon)" : "var(--line)", background: isSel ? "var(--maroon)" : "transparent", color: isSel ? "var(--paper)" : "var(--ink)" }}
                          >
                            {opt.name}
                            {delta !== 0 && (
                              <span style={{ fontFamily: "var(--font-mono)", color: isSel ? "var(--paper)" : delta > 0 ? "var(--saffron)" : "var(--juniper)", opacity: isSel ? 0.9 : 1 }}>
                                {delta > 0 ? "+" : ""}{delta}
                              </span>
                            )}
                          </button>
                        );
                      })}
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}

        <div className="flex items-center justify-between mt-3 pt-3 mb-3" style={{ borderTop: "1px dashed var(--line)" }}>
          <span className="text-sm font-semibold" style={{ color: "var(--ink)" }}>套餐總金額</span>
          <span style={{ fontFamily: "var(--font-mono)", color: "var(--maroon)" }} className="text-lg font-bold">{fmt(finalPrice)}</span>
        </div>
        <button onClick={handleConfirm} className="w-full py-3 rounded-xl text-sm font-bold" style={{ background: "var(--maroon)", color: "var(--paper)" }}>
          加入購物車
        </button>
      </div>
    </div>
  );
}

/* 內場出單卡：進來就能直接勾選品項，全部勾完（或手動）按一下就完成出餐 */
/* 左滑刪除：拖過門檻就觸發刪除，放開沒過門檻就彈回去。滑鼠拖曳、觸控都可以用。 */
function SwipeToDelete({ onDelete, children, pill = false }) {
  const [dx, setDx] = useState(0);
  const dxRef = useRef(0); // 跟 dx state 同步更新，但 ref 沒有 React 重新渲染的時間差，
                            // finish() 判斷門檻一定要讀這個才不會在快速滑動時讀到過期的值
  const dragging = useRef(false);
  const startX = useRef(0);
  const THRESHOLD = pill ? -50 : -96;
  const maxDrag = pill ? -80 : -160;

  const onPointerDown = (e) => {
    dragging.current = true;
    startX.current = e.clientX;
  };
  const onPointerMove = (e) => {
    if (!dragging.current) return;
    const delta = Math.min(0, Math.max(e.clientX - startX.current, maxDrag));
    dxRef.current = delta;
    setDx(delta);
  };
  const finish = () => {
    if (!dragging.current) return;
    dragging.current = false;
    if (dxRef.current < THRESHOLD) {
      onDelete();
    }
    dxRef.current = 0;
    setDx(0);
  };

  return (
    <div className="relative" style={pill ? { display: "inline-block" } : undefined}>
      <div className={`absolute inset-0 flex items-center justify-end ${pill ? "pr-2.5 rounded-full" : "pr-6 rounded-lg"}`} style={{ background: "var(--maroon)" }}>
        <div className="flex items-center gap-1.5" style={{ color: "var(--paper)" }}>
          <Trash2 size={pill ? 12 : 16} />
          {!pill && <span className="text-xs font-semibold">左滑刪除</span>}
        </div>
      </div>
      <div
        onPointerDown={onPointerDown}
        onPointerMove={onPointerMove}
        onPointerUp={finish}
        onPointerLeave={finish}
        onPointerCancel={finish}
        style={{ transform: `translateX(${dx}px)`, transition: dragging.current ? "none" : "transform .2s ease", touchAction: "pan-y" }}
      >
        {children}
      </div>
    </div>
  );
}

/* 右滑完成：每做完一道菜，往右滑過門檻就切換完成狀態（跟 SwipeToDelete 方向相反、顏色是綠色） */
function SwipeToComplete({ onTrigger, children }) {
  const [dx, setDx] = useState(0);
  const dxRef = useRef(0);
  const dragging = useRef(false);
  const startX = useRef(0);
  const THRESHOLD = 70;
  const maxDrag = 120;

  const onPointerDown = (e) => {
    dragging.current = true;
    startX.current = e.clientX;
  };
  const onPointerMove = (e) => {
    if (!dragging.current) return;
    const delta = Math.max(0, Math.min(e.clientX - startX.current, maxDrag));
    dxRef.current = delta;
    setDx(delta);
  };
  const finish = () => {
    if (!dragging.current) return;
    dragging.current = false;
    if (dxRef.current > THRESHOLD) {
      onTrigger();
    }
    dxRef.current = 0;
    setDx(0);
  };

  return (
    <div className="relative">
      <div className="absolute inset-0 flex items-center pl-4 rounded" style={{ background: "var(--juniper)" }}>
        <Check size={14} color="var(--paper)" />
      </div>
      <div
        onPointerDown={onPointerDown}
        onPointerMove={onPointerMove}
        onPointerUp={finish}
        onPointerLeave={finish}
        onPointerCancel={finish}
        style={{ transform: `translateX(${dx}px)`, transition: dragging.current ? "none" : "transform .2s ease", touchAction: "pan-y", background: "var(--paper)" }}
      >
        {children}
      </div>
    </div>
  );
}

function EditOrderModal({ order, onSave, onClose }) {
  const [items, setItems] = useState(() => order.items.map((i) => ({ ...i })));
  const [saving, setSaving] = useState(false);
  const total = items.reduce((sum, i) => sum + i.price * i.qty, 0);

  const changeQty = (id, delta) => {
    setItems((prev) => prev.map((i) => (i.id === id ? { ...i, qty: Math.max(0, i.qty + delta) } : i)).filter((i) => i.qty > 0));
  };
  const removeItem = (id) => setItems((prev) => prev.filter((i) => i.id !== id));

  const handleSave = async () => {
    if (items.length === 0) {
      alert("訂單品項不能清空喔，如果整張訂單都不要了，請用刪除這張訂單的功能。");
      return;
    }
    setSaving(true);
    await onSave(items, total);
    setSaving(false);
  };

  return (
    <div className="fixed inset-0 z-40 flex items-end sm:items-center justify-center p-0 sm:p-4" style={{ background: "rgba(59,46,34,.55)" }}>
      <div className="card w-full sm:max-w-md p-5 slide-up" style={{ borderRadius: "16px 16px 0 0", maxHeight: "88vh", overflowY: "auto" }}>
        <div className="flex items-start justify-between mb-1">
          <div>
            <p className="text-xs opacity-60" style={{ color: "var(--ink)" }}>第 {order.table} 桌．#{order.id.slice(-6)}</p>
            <h3 style={{ fontFamily: "var(--font-display)", color: "var(--maroon)" }} className="text-lg font-bold">修改訂單內容</h3>
          </div>
          <button onClick={onClose} title="關閉" className="p-1 opacity-50"><X size={18} /></button>
        </div>
        <p className="text-xs mb-4" style={{ color: "var(--ink)", opacity: 0.7 }}>調整數量或刪除點錯的品項，改完按「儲存變更」就會同步到內場看板。</p>

        <div className="space-y-2 mb-4">
          {items.map((i) => (
            <div key={i.id} className="flex items-center gap-2 p-2 rounded-lg" style={{ background: "var(--cream)" }}>
              <div className="flex-1 min-w-0">
                <p className="text-sm font-medium truncate" style={{ color: "var(--ink)" }}>{i.name}</p>
                <p style={{ fontFamily: "var(--font-mono)", color: "var(--maroon)" }} className="text-xs">{fmt(i.price)} × {i.qty} = {fmt(i.price * i.qty)}</p>
              </div>
              <div className="flex items-center gap-1 shrink-0">
                <button onClick={() => changeQty(i.id, -1)} className="rounded-full flex items-center justify-center" style={{ width: 26, height: 26, background: "var(--paper)", border: "1px solid var(--line)" }}><Minus size={13} /></button>
                <span style={{ fontFamily: "var(--font-mono)" }} className="text-sm w-5 text-center">{i.qty}</span>
                <button onClick={() => changeQty(i.id, 1)} className="rounded-full flex items-center justify-center" style={{ width: 26, height: 26, background: "var(--paper)", border: "1px solid var(--line)" }}><Plus size={13} /></button>
                <button onClick={() => removeItem(i.id)} title="刪除這項" className="rounded-full flex items-center justify-center ml-1" style={{ width: 26, height: 26, color: "var(--maroon)" }}><Trash2 size={14} /></button>
              </div>
            </div>
          ))}
          {items.length === 0 && (
            <p className="text-xs text-center py-4 opacity-50" style={{ color: "var(--ink)" }}>已經沒有品項了，儲存前至少留一項，或直接用刪除整張訂單的功能。</p>
          )}
        </div>

        <div className="flex items-center justify-between mb-3 pt-2" style={{ borderTop: "1px dashed var(--line)" }}>
          <span className="text-sm font-semibold" style={{ color: "var(--ink)" }}>修改後金額</span>
          <span style={{ fontFamily: "var(--font-mono)", color: "var(--maroon)" }} className="text-base font-bold">{fmt(total)}</span>
        </div>

        <button
          onClick={handleSave}
          disabled={saving || items.length === 0}
          className="w-full py-3 rounded-xl text-sm font-bold mb-2"
          style={{ background: "var(--maroon)", color: "var(--paper)", opacity: saving || items.length === 0 ? 0.5 : 1 }}
        >
          {saving ? "儲存中…" : "儲存變更"}
        </button>
        <button onClick={onClose} className="w-full text-center text-xs py-1 opacity-50" style={{ color: "var(--ink)" }}>
          取消，不要修改
        </button>
      </div>
    </div>
  );
}

/* QR Code 桌卡產生器：給店家列印，貼在桌上讓顧客掃碼直接進點餐頁（不需登入任何帳號） */
function QrBoard() {
  const origin = window.location.origin + window.location.pathname.replace(/index\.html$/, "");
  const [copiedTable, setCopiedTable] = useState(null);

  const copyLink = (url, t) => {
    navigator.clipboard?.writeText(url).then(() => {
      setCopiedTable(t);
      setTimeout(() => setCopiedTable(null), 1500);
    });
  };

  return (
    <div className="max-w-5xl mx-auto px-4 py-6">
      <h2 style={{ fontFamily: "var(--font-display)", color: "var(--maroon)" }} className="text-xl font-bold mb-1">桌卡 QR Code</h2>
      <p className="text-sm mb-6 opacity-70" style={{ color: "var(--ink)" }}>把每一桌的 QR Code 印出來貼在桌上，顧客掃碼就直接進入該桌的點餐頁面，完全不需要登入任何帳號。</p>
      <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
        {TABLES.map((t) => (
          <TableQrCard key={t} table={t} origin={origin} copied={copiedTable === t} onCopy={copyLink} />
        ))}
      </div>
    </div>
  );
}

function TableQrCard({ table, origin, copied, onCopy }) {
  const boxRef = useRef(null);
  const url = `${origin}?table=${table}`;
  useEffect(() => {
    if (boxRef.current) {
      boxRef.current.innerHTML = "";
      new QRCodeLib(boxRef.current, {
        text: url,
        width: 168,
        height: 168,
        colorDark: "#3B2E22",
        colorLight: "#FBF3E3",
        correctLevel: QRCodeLib.CorrectLevel.M,
      });
    }
  }, [url]);
  return (
    <div className="card p-3 flex flex-col items-center text-center">
      <p style={{ fontFamily: "var(--font-display)", color: "var(--maroon)" }} className="text-sm font-bold mb-2">第 {table} 桌</p>
      <div ref={boxRef} className="rounded-md overflow-hidden" style={{ border: "1px solid var(--line)", width: 168, height: 168 }} />
      <p className="text-[11px] mt-2 break-all opacity-60" style={{ color: "var(--ink)", fontFamily: "var(--font-mono)" }}>{url}</p>
      <button onClick={() => onCopy(url, table)} className="mt-2 flex items-center gap-1 text-[12px] font-semibold px-2.5 py-1 rounded-full" style={{ background: copied ? "var(--juniper)" : "var(--cream)", color: copied ? "var(--paper)" : "var(--ink)" }}>

  );
}

  const [reportPeriod, setReportPeriod] = useState("day"); // day | week | month

  const [protein, setProtein] = useState(null);
  const [pairing, setPairing] = useState(null); // { name, id }
  const [showAddonUpsell, setShowAddonUpsell] = useState(false);
  const [openingGroupSet, setOpeningGroupSet] = useState(null);
  const [showCartPanel, setShowCartPanel] = useState(false);
  const closeCartPanel = () => setShowCartPanel(false);
  const [myOrders, setMyOrders] = useState([]);

  const refreshMyOrders = useCallback(() => {
    if (!table) { setMyOrders([]); return; }
    fetchTableOrders(table).then(setMyOrders);
  }, [table]);

  useEffect(() => { refreshMyOrders(); }, [refreshMyOrders]);

  /* 購物車面板打開時，順便輪詢一下本桌訂單狀態（例如廚房出餐了），不用手動重開才會更新 */
  useEffect(() => {
    if (!showCartPanel) return;
    const t = setInterval(refreshMyOrders, 15000);
    return () => clearInterval(t);
  }, [showCartPanel, refreshMyOrders]);
  const prevNewCount = useRef(0);

  /* ---------------- 員工模式：顧客只看得到點餐頁，內場/報表/QR 要輸入 PIN 才會出現 ---------------- */
  const [staffUnlocked, setStaffUnlocked] = useState(() => {
    try { return localStorage.getItem(STAFF_UNLOCK_KEY) === "1"; } catch { return false; }
  });
  const [showPinPrompt, setShowPinPrompt] = useState(staffRequested && !staffUnlocked);

  useEffect(() => {
    if (!staffUnlocked && tab !== "order") setTab("order");
  }, [staffUnlocked, tab]);

  const unlockStaff = () => {
    try { localStorage.setItem(STAFF_UNLOCK_KEY, "1"); } catch {}
    setStaffUnlocked(true);
    setShowPinPrompt(false);
    if (window.history?.replaceState) {
      const url = new URL(window.location.href);
      url.searchParams.delete("staff");
      window.history.replaceState({}, "", url);
    }
  };
  const lockStaff = () => {
    try { localStorage.removeItem(STAFF_UNLOCK_KEY); } catch {}
    setStaffUnlocked(false);
    setTab("order");
  };

  const refresh = useCallback(async () => {
    if (!staffUnlocked) return;
    const o = await fetchBoardOrders();
    setOrders(o);
  }, [staffUnlocked]);

  useEffect(() => { refresh(); }, [refresh]);

  /* 內場提示音需要使用者先跟頁面互動過一次，瀏覽器才會放行 */
  useEffect(() => unlockAudioOnFirstInteraction(), []);

  /* 即時同步：Supabase Realtime 推播，訂單一有異動廚房畫面立刻更新；
     另外保留 20 秒安全網輪詢，避免 WebSocket 斷線時漏單。
     只有員工模式解鎖時才會訂閱／拉取訂單資料，顧客的裝置完全不會碰到其他桌的訂單內容。 */
  useEffect(() => {
    if (!sb || !staffUnlocked) return;
    const channel = sb
      .channel("orders-realtime")
      .on("postgres_changes", { event: "*", schema: "public", table: "orders" }, () => { refresh(); })
      .subscribe();
    const safetyNet = setInterval(refresh, 20000);
    return () => {
      sb.removeChannel(channel);
      clearInterval(safetyNet);
    };
  }, [refresh, staffUnlocked]);

  useEffect(() => {
    const newCount = orders.filter((o) => o.status === "active").length;
    if (tab === "kitchen" && newCount > prevNewCount.current) beep();
    prevNewCount.current = newCount;
  }, [orders, tab]);

  useEffect(() => {
    if (tab !== "report") return;
    const [start, end] = reportRange(reportDate, reportPeriod);
    fetchReportOrders(start, end).then(setReportOrders);
  }, [tab, reportDate, reportPeriod]);

  /* ---------------- 顧客端：購物車操作 ---------------- */

  const addLine = (item) => {
    setCart((c) => {
      const found = c.find((i) => i.id === item.id);
      if (found) return c.map((i) => (i.id === item.id ? { ...i, qty: i.qty + 1 } : i));
      return [...c, { id: item.id, name: item.name, price: item.price, qty: 1, cat: item.cat || "other" }];
    });
  };

  const addToCart = (item) => {
    addLine(item);
    if (item.needsPairing) setPairing({ name: item.name, id: item.id });
  };

  /* 多人套餐選好品項後，把整組拆開的品項一次加進購物車 */
  const confirmGroupSet = (lines) => {
    setCart((c) => [...c, ...lines]);
    setOpeningGroupSet(null);
  };

  /* 給加價購裡的 MOMO 用：直接指定某個 variant 加入 */
  const addVariantById = (groupItem, key, cat) => {
    const v = groupItem.variants.find((x) => x.key === key);
    addToCart({ id: `${groupItem.id}-${v.key}`, name: `${groupItem.name} ${v.label}`, price: v.price, needsPairing: groupItem.needsPairing, cat });
  };

  const confirmPairing = (tier, choices, total) => {
    addLine({ id: tier.id, name: comboLineName(tier, choices), price: total, cat: "combo" });
    setPairing(null);
    setShowAddonUpsell(true);
  };

  const skipPairing = () => setPairing(null);

  const changeQty = (id, delta) => {
    setCart((c) => c.map((i) => (i.id === id ? { ...i, qty: i.qty + delta } : i)).filter((i) => i.qty > 0));
  };
  const removeLine = (id) => setCart((c) => c.filter((i) => i.id !== id));

  const cartTotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
  const cartCount = cart.reduce((s, i) => s + i.qty, 0);
  const hasAnchorDish = cart.some((i) => i.cat === "curry" || i.cat === "traditional");
  const needsAnchor = cart.length > 0 && !hasAnchorDish;

  const submitOrder = async () => {
    if (!table || cart.length === 0 || submitting || needsAnchor) return;
    setSubmitting(true);
    const newOrder = {
      id: genId(),
      table,
      items: cart.map(({ id, name, price, qty, cat }) => ({ id, name, price, qty, cat, done: false })),
      total: cartTotal,
      note,
      status: "active",
      payment: "unpaid",
      createdAt: new Date().toISOString(),
    };
    const { error } = await insertOrder(newOrder);
    if (error) {
      setConfirmMsg("送出失敗，請確認網路連線後再試一次");
      setSubmitting(false);
      setTimeout(() => setConfirmMsg(null), 4500);
      return;
    }
    refresh();
    refreshMyOrders();
    setConfirmMsg(`扎西德勒！訂單已送達內場，桌號 ${table}．單號 ${newOrder.id.slice(-6)}`);
    setCart([]);
    setNote("");
    setProtein(null);
    setTimeout(() => setSubmitting(false), 2500);
    setTimeout(() => setConfirmMsg(null), 4500);
  };

  /* ---------------- 內場端 ---------------- */

  const [now, setNow] = useState(Date.now());
  useEffect(() => {
    if (tab !== "kitchen") return;
    const t = setInterval(() => setNow(Date.now()), 30000);
    return () => clearInterval(t);
  }, [tab]);

  const toggleItemDone = async (orderId, itemId) => {
    const target = orders.find((o) => o.id === orderId);
    if (!target) return;
    const newItems = target.items.map((i) => (i.id === itemId ? { ...i, done: !i.done } : i));
    setOrders((prev) => prev.map((o) => (o.id === orderId ? { ...o, items: newItems } : o)));
    await updateOrderItems(orderId, newItems);
  };
  const completeOrder = async (id) => {
    setOrders((prev) => prev.map((o) => (o.id === id ? { ...o, status: "served" } : o)));
    await updateOrderStatus(id, "served");
    refresh();
  };
  const setPayment = async (id, method) => {
    setOrders((prev) => prev.map((o) => (o.id === id ? { ...o, payment: method } : o)));
    await updateOrderPayment(id, method);
  };
  const removeOrder = async (id) => {
    const { error } = await deleteOrder(id);
    if (error) {
      alert("刪除失敗：資料庫還沒開放刪除權限。請到 Supabase 的 SQL Editor 重新執行一次 supabase-schema.sql（裡面已經加了刪除的權限設定）。");
      return;
    }
    setOrders((prev) => prev.filter((o) => o.id !== id));
  };

  const [editingOrder, setEditingOrder] = useState(null);
  const saveOrderEdit = async (items, total) => {
    const orderId = editingOrder.id;
    const { error } = await updateOrderItemsAndTotal(orderId, items, total);
    if (error) {
      alert("儲存失敗：" + error.message);
      return;
    }
    setOrders((prev) => prev.map((o) => (o.id === orderId ? { ...o, items, total } : o)));
    setEditingOrder(null);
  };

  const activeOrders = orders.filter((o) => o.status === "active").sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
  const servedOrders = orders.filter((o) => o.status === "served").sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 10);

  const elapsedInfo = (createdAt) => {
    const mins = Math.floor((now - new Date(createdAt).getTime()) / 60000);
    let color = "var(--juniper)";
    if (mins >= 10) color = "var(--maroon)";
    else if (mins >= 5) color = "var(--saffron)";
    return { mins: Math.max(mins, 0), color };
  };

  /* ---------------- 報表 ---------------- */

  const dayOrders = reportOrders;
  const revenue = dayOrders.reduce((s, o) => s + o.total, 0);
  const count = dayOrders.length;
  const avgTicket = count ? Math.round(revenue / count) : 0;
  const byPayment = { cash: 0, transfer: 0, unpaid: 0 };
  dayOrders.forEach((o) => (byPayment[o.payment] += o.total));
  const itemTally = {};
  dayOrders.forEach((o) => o.items.forEach((i) => { itemTally[i.name] = (itemTally[i.name] || 0) + i.qty; }));
  const topItems = Object.entries(itemTally).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const comboAttachRate = (() => {
    const mainCount = dayOrders.reduce((s, o) => s + o.items.filter((i) => i.name.startsWith("套餐")).length, 0);
    const curryCount = dayOrders.reduce((s, o) => s + o.items.filter((i) => !i.name.startsWith("套餐")).length, 0) || 1;
    return Math.round((mainCount / curryCount) * 100);
  })();

  const momoItem = TRADITIONAL_GROUPED.find((i) => i.id === "momo");

  return (
    <div style={{ fontFamily: "var(--font-body)", background: "var(--cream)" }} className="min-h-screen">
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;600&family=Rozha+One&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
        html{ font-size:17.5px; }
        :root{
          --cream:#F7ECD3; --paper:#FBF3E3; --maroon:#A6303B; --maroon-dark:#7C2028;
          --saffron:#DE9331; --juniper:#4B6C56; --ink:#3B2E22; --line:#E5CFA0;
          --clay:#8B6F47; --sky:#3F6DA8; --plum:#7A5C8E;
          --font-display:'Noto Serif TC', serif; --font-body:'Noto Sans TC', sans-serif;
          --font-accent:'Rozha One', serif; --font-mono:'IBM Plex Mono', monospace;
        }
        body{ background:var(--cream); }
        .card{ background:var(--paper); border:1px solid var(--line); border-radius:10px; }
        .ticket{ background:var(--paper); border:1px solid var(--line); border-radius:8px; box-shadow:0 3px 0 var(--line); }
        .tab-btn{ transition: all .15s ease; }
        .chip-btn{ transition: transform .1s ease; }
        .chip-btn:active{ transform: scale(0.96); }
        .protein-btn{ transition: all .15s ease; }
        @keyframes pulseNew{ 0%,100%{opacity:1} 50%{opacity:.55} }
        .pulse-new{ animation: pulseNew 1.6s ease-in-out infinite; }
        @keyframes slideUp{ from{ transform:translateY(16px); opacity:0 } to{ transform:translateY(0); opacity:1 } }
        .slide-up{ animation: slideUp .22s ease; }
      `}</style>

      {!SUPABASE_READY && <SupabaseSetupBanner />}

      <header className="px-3 sm:px-5 py-3 sm:py-4 flex items-center justify-between sticky top-0 z-20 border-b-2 gap-2" style={{ background: "var(--maroon)", borderColor: "var(--saffron)" }}>
        <div className="flex items-center gap-1.5 sm:gap-2 min-w-0">
          <Mountain size={20} style={{ color: "var(--saffron)" }} />
          <div className="min-w-0">
            <div style={{ fontFamily: "var(--font-display)", color: "var(--paper)", fontWeight: 900 }} className="text-base sm:text-xl leading-tight truncate">西藏食</div>
            <div style={{ fontFamily: "var(--font-accent)", color: "var(--saffron)", letterSpacing: "0.08em" }} className="text-[9px] sm:text-[11px] leading-tight truncate">TIDIAN KITCHEN</div>
          </div>
        </div>
        <nav className="flex gap-0.5 sm:gap-1 shrink-0 items-center">
          {(staffUnlocked
            ? [
                { id: "order", label: "顧客點餐", icon: ShoppingCart },
                { id: "kitchen", label: "內場出單", icon: ChefHat },
                { id: "report", label: "每日報表", icon: BarChart3 },
                { id: "qr", label: "桌卡 QR", icon: QrCode },
              ]
            : [{ id: "order", label: "顧客點餐", icon: ShoppingCart }]
          ).map(({ id, label, icon: TabIcon }) => (
            <button
              key={id}
              onClick={() => {
                if (id === "order" && tab === "order") {
                  setShowCartPanel((v) => !v);
                } else {
                  setTab(id);
                  setShowCartPanel(false);
                }
              }}
              title={id === "order" ? "查看購物車" : label}
              className="tab-btn relative flex items-center gap-1.5 px-2 sm:px-3 py-1.5 sm:py-2 rounded-md text-sm"
              style={{ background: tab === id ? "var(--saffron)" : "transparent", color: tab === id ? "var(--maroon-dark)" : "var(--paper)", fontWeight: tab === id ? 700 : 400 }}
            >
              <TabIcon size={16} />
              {id === "order" && cartCount > 0 && (
                <span
                  className="absolute -top-1 -right-1 flex items-center justify-center text-[10px] font-bold rounded-full"
                  style={{ width: 16, height: 16, background: "var(--maroon)", color: "var(--paper)" }}
                >
                  {cartCount}
                </span>
              )}
              <span className="hidden sm:inline">{label}</span>
            </button>
          ))}
          {staffUnlocked && (
            <button onClick={lockStaff} title="登出員工模式" className="flex items-center px-2 py-1.5 sm:py-2 rounded-md opacity-70" style={{ color: "var(--paper)" }}>
              <Lock size={15} />
            </button>
          )}
        </nav>
      </header>

      {showPinPrompt && (
        <StaffPinModal
          onSubmit={(pin) => {
            if (pin === STAFF_PIN) { unlockStaff(); return true; }
            return false;
          }}
          onCancel={() => {
            setShowPinPrompt(false);
            if (window.history?.replaceState) {
              const url = new URL(window.location.href);
              url.searchParams.delete("staff");
              window.history.replaceState({}, "", url);
            }
          }}
        />
      )}

      {confirmMsg && (
        <div className="fixed top-20 left-1/2 -translate-x-1/2 z-30 px-4 py-3 rounded-lg shadow-lg flex items-center gap-2 slide-up" style={{ background: "var(--juniper)", color: "var(--paper)" }}>
          <Check size={18} />
          <span className="text-sm">{confirmMsg}</span>
        </div>
      )}

      {/* 購物車面板：從右上角購物車圖示點開，看明細、刪品項、送出訂單都在這裡 */}
      {showCartPanel && tab === "order" && (
        <>
          <div className="fixed inset-0 z-30" onClick={closeCartPanel} />
          <div className="fixed top-16 right-2 sm:right-4 z-40 w-[92vw] sm:w-96 max-h-[75vh] flex flex-col rounded-xl shadow-2xl overflow-hidden slide-up" style={{ background: "var(--maroon)", border: "1px solid var(--saffron)" }}>
            <div className="flex items-center justify-between px-4 py-3 border-b" style={{ borderColor: "var(--maroon-dark)" }}>
              <span style={{ color: "var(--paper)", fontFamily: "var(--font-display)" }} className="font-bold">我的購物車</span>
              <button onClick={() => setShowCartPanel(false)} style={{ color: "var(--paper)" }}><X size={18} /></button>
            </div>
            <div className="flex-1 overflow-y-auto px-4 py-3">
              {myOrders.length > 0 && (
                <div className="mb-4 pb-4" style={{ borderBottom: "1px dashed var(--maroon-dark)" }}>
                  <p className="text-xs font-bold mb-2" style={{ color: "var(--saffron)" }}>已送出的訂單</p>
                  <div className="space-y-2.5">
                    {myOrders.map((o) => (
                      <div key={o.id} className="rounded-lg p-2.5" style={{ background: "var(--maroon-dark)" }}>
                        <div className="flex items-center justify-between mb-1.5">
                          <span className="text-[11px]" style={{ color: "var(--paper)", opacity: 0.7, fontFamily: "var(--font-mono)" }}>
                            {new Date(o.createdAt).toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit" })}．單號 {o.id.slice(-6)}
                          </span>
                          <span className="text-[11px] font-bold px-2 py-0.5 rounded-full" style={{ background: o.status === "served" ? "var(--juniper)" : "var(--saffron)", color: o.status === "served" ? "var(--paper)" : "var(--maroon-dark)" }}>
                            {o.status === "served" ? "✓ 已出餐" : "準備中"}
                          </span>
                        </div>
                        <div className="space-y-0.5">
                          {o.items.map((i) => (
                            <div key={i.id} className="flex items-center justify-between text-xs" style={{ color: "var(--paper)", opacity: 0.9 }}>
                              <span>{i.name}</span>
                              <span style={{ fontFamily: "var(--font-mono)" }}>x{i.qty}</span>
                            </div>
                          ))}
                        </div>
                        <div className="flex items-center justify-between mt-1.5 pt-1.5" style={{ borderTop: "1px dashed rgba(255,255,255,.2)" }}>
                          <span className="text-xs" style={{ color: "var(--paper)", opacity: 0.7 }}>小計</span>
                          <span className="text-xs font-bold" style={{ color: "var(--paper)", fontFamily: "var(--font-mono)" }}>{fmt(o.total)}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
              {cart.length === 0 ? (
                <p className="text-sm text-center py-4" style={{ color: "var(--paper)", opacity: 0.7 }}>
                  {myOrders.length > 0 ? "還想再加點嗎？回到菜單挑選吧！" : "碗裡空空的🥲先點份咖哩吧！"}
                </p>
              ) : (
                <div className="space-y-2.5">
                  {myOrders.length > 0 && <p className="text-xs font-bold" style={{ color: "var(--saffron)" }}>繼續加點</p>}
                  {cart.map((i) => (
                    <div key={i.id} className="flex items-center justify-between text-sm gap-1" style={{ color: "var(--paper)" }}>
                      <span className="flex-1">{i.name}</span>
                      <div className="flex items-center gap-1.5 shrink-0">
                        <button onClick={() => changeQty(i.id, -1)} className="w-6 h-6 rounded flex items-center justify-center" style={{ background: "var(--maroon-dark)" }}><Minus size={12} /></button>
                        <span style={{ fontFamily: "var(--font-mono)" }} className="w-4 text-center">{i.qty}</span>
                        <button onClick={() => changeQty(i.id, 1)} className="w-6 h-6 rounded flex items-center justify-center" style={{ background: "var(--maroon-dark)" }}><Plus size={12} /></button>
                        <span style={{ fontFamily: "var(--font-mono)", width: 56 }} className="text-right">{fmt(i.price * i.qty)}</span>
                        <button onClick={() => removeLine(i.id)} title="移除這項" className="w-6 h-6 rounded flex items-center justify-center opacity-70" style={{ background: "var(--maroon-dark)" }}><Trash2 size={12} /></button>
                      </div>
                    </div>
                  ))}
                  <input value={note} onChange={(e) => setNote(e.target.value)} placeholder="備註（例如：不要香菜）" className="w-full mt-2 px-2 py-1.5 rounded text-sm" style={{ background: "var(--maroon-dark)", color: "var(--paper)" }} />
                </div>
              )}
            </div>
            <div className="px-4 py-3 border-t" style={{ borderColor: "var(--maroon-dark)" }}>
              {needsAnchor && (
                <p className="text-xs mb-2 flex items-center gap-1.5" style={{ color: "var(--saffron)" }}>
                  <AlertCircle size={13} /> 還沒加咖哩或西藏傳統料理喔，單點烤餅／主食／飲品沒辦法單獨送出
                </p>
              )}
              <div className="flex items-center justify-between mb-2">
                <span style={{ color: "var(--paper)" }} className="text-sm">{cartCount} 項</span>
                <span style={{ fontFamily: "var(--font-mono)", color: "var(--paper)" }} className="text-sm font-bold">{fmt(cartTotal)}</span>
              </div>
              <button onClick={submitOrder} disabled={!table || cart.length === 0 || submitting || needsAnchor} className="w-full px-5 py-2.5 rounded-md text-sm font-semibold"
                style={{ background: !table || cart.length === 0 || submitting || needsAnchor ? "#8a7a5c" : "var(--saffron)", color: "var(--maroon-dark)", cursor: !table || cart.length === 0 || submitting || needsAnchor ? "not-allowed" : "pointer" }}>
                {submitting ? "送出中…" : !table ? "請先選桌號" : needsAnchor ? "請先加咖哩或傳統料理" : "送出訂單"}
              </button>
            </div>
          </div>
        </>
      )}

      {pairing && (
        <PairingModal sourceName={pairing.name} onConfirm={confirmPairing} onSkip={skipPairing} />
      )}

      {showAddonUpsell && (
        <AddonUpsellModal
          onAddAddon={(a) => addToCart(a)}
          onAddMomo={(key) => addVariantById(momoItem, key, "traditional")}
          onClose={() => {
            setShowAddonUpsell(false);
            setTimeout(() => {
              document.getElementById("traditional-cuisine-section")?.scrollIntoView({ behavior: "smooth", block: "start" });
            }, 50);
          }}
          cartCount={cartCount}
          cartTotal={cartTotal}
        />
      )}

      {editingOrder && (
        <EditOrderModal order={editingOrder} onSave={saveOrderEdit} onClose={() => setEditingOrder(null)} />
      )}

      {openingGroupSet && (
        <GroupSetModal set={openingGroupSet} onConfirm={confirmGroupSet} onClose={() => setOpeningGroupSet(null)} />
      )}

      {/* ================= 顧客點餐 ================= */}
      {tab === "order" && (
        <div className="max-w-5xl mx-auto px-4 py-6 pb-16">
          {/* Hero */}
          <div className="card relative overflow-hidden mb-5 p-5" style={{ borderTopRightRadius: 0 }}>
            <PrayerFlags />
            <h2 style={{ fontFamily: "var(--font-display)", color: "var(--maroon)" }} className="text-2xl font-black mt-3 mb-1 max-w-[70%]">
              扎西德勒，歡迎光臨西藏食
            </h2>
            <p style={{ color: "var(--ink)" }} className="text-sm opacity-80 mb-2 max-w-[70%]">
              來自高原的香料記憶。選好桌號，就從招牌藏印咖哩開始吧！
            </p>
            <span className="inline-block text-xs font-semibold px-2.5 py-1 rounded-full" style={{ background: "var(--maroon)", color: "var(--paper)" }}>
              每人低消 NT$250
            </span>
            <img src={IMG_CURRY} alt="經典藏印咖哩" className="absolute top-0 right-0" style={{ width: 150, height: 150, objectFit: "contain", filter: "drop-shadow(-4px 4px 6px rgba(59,46,34,.4))" }} />
          </div>

          {/* 桌號 */}
          <div className="flex items-center gap-3 mb-6">
            <span className="text-sm font-medium" style={{ color: "var(--ink)" }}>桌號</span>
            <select value={table ?? ""} onChange={(e) => setTable(Number(e.target.value))} className="border rounded-md px-3 py-2 text-sm"
              style={{ borderColor: "var(--line)", fontFamily: "var(--font-mono)", background: "var(--paper)", color: "var(--ink)" }}>
              <option value="" disabled>請選擇</option>
              {TABLES.map((t) => (<option key={t} value={t}>第 {t} 桌</option>))}
            </select>
          </div>

          {/* 多人套餐：主廚固定搭好組合，適合揪團直接一鍵加入，不用一道一道慢慢點 */}
          <SectionHeader zh="多人套餐" en="GROUP SET MEALS" icon={Sparkles} />
          <p className="text-sm mb-3" style={{ color: "var(--ink)", opacity: 0.7 }}>主廚幫你配好，適合朋友聚餐直接一鍵加入，比單點划算。</p>
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-8">
            {GROUP_SET_TEMPLATES.map((set) => (<GroupSetPreviewCard key={set.id} set={set} onOpen={setOpeningGroupSet} />))}
          </div>

          {/* Section 1：建構你的咖哩 */}
          <SectionHeader zh="建構你的藏印咖哩" en="BUILD YOUR CURRY" icon={Sparkles} />
          <p className="text-sm mb-3" style={{ color: "var(--ink)", opacity: 0.7 }}>三步驟：先選蛋白質，再選喜歡的醬底，最後別忘了挑你想搭配的主食。</p>
          <NoticeBox>咖哩不附白飯或烤餅，記得從下方「人氣搭配主食」選一份主食搭配，吃起來才夠味！</NoticeBox>
          <div className="flex gap-2 mb-4 flex-wrap">
            {PROTEINS.map((p) => (
              <button key={p.id} onClick={() => setProtein(p.id)} className="protein-btn px-4 py-2.5 rounded-full text-sm font-semibold border-2"
                style={{ borderColor: protein === p.id ? "var(--maroon)" : "var(--line)", background: protein === p.id ? "var(--maroon)" : "var(--paper)", color: protein === p.id ? "var(--paper)" : "var(--ink)" }}>
                {p.label}<span className="ml-1 opacity-60 text-xs">{p.sub}</span>
              </button>
            ))}
          </div>

          {protein && <GroupedDishGrid items={CURRY_BASES[protein]} onAdd={addToCart} featuredLabel="招牌藏印咖哩" cat="curry" />}
          {!protein && (
            <p className="text-sm mb-8 opacity-50" style={{ color: "var(--ink)" }}>👆 先選一種蛋白質，馬上看到適合的咖哩口味。</p>
          )}

          {/* Section 2：人氣搭配主食（套餐＋烤餅＋主食＋加價購 整合在一起） */}
          <SectionHeader zh="人氣搭配主食" en="PAIR YOUR CURRY" icon={Flame} />

          <SubgroupLabel>套餐組合（最多人選）</SubgroupLabel>
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-6">
            {COMBO_TIERS.map((c) => (<ComboTierCard key={c.id} tier={c} onAdd={addLine} />))}
          </div>

          <SubgroupLabel>✚ 加價購推薦</SubgroupLabel>
          <div className="card p-4 mb-6" style={{ borderStyle: "dashed", borderColor: "var(--maroon)", borderWidth: 1.5 }}>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
              {ADDONS.map((a) => (
                <QuickAddRow key={a.id} name={a.name} price={a.price} onAdd={() => addToCart(a)} />
              ))}
              <QuickAddRow name="加購西藏MOMO記憶蒸餃 牛肉" price={190} onAdd={() => addVariantById(momoItem, "beef", "traditional")} />
              <QuickAddRow name="加購西藏MOMO記憶蒸餃 豬肉" price={170} onAdd={() => addVariantById(momoItem, "pork", "traditional")} />
            </div>
          </div>

          {/* 西藏傳統料理：提前放在加價購推薦下方、單點烤餅上方，讓消費者早一點看到 */}
          <div id="traditional-cuisine-section" style={{ scrollMarginTop: 76 }}>
            <SectionHeader zh="西藏傳統料理" en="TIBETAN TRADITIONAL CUISINE" icon={ChefHat} />
            <GroupedDishGrid items={TRADITIONAL_GROUPED} onAdd={addToCart} featuredLabel="主廚推薦" cat="traditional" />
          </div>

          <SubgroupLabel>單點烤餅</SubgroupLabel>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6">
            {NAAN.map((item) => (<DishCard key={item.id} item={item} onAdd={addToCart} cat="naan" />))}
          </div>

          <SubgroupLabel>單點主食</SubgroupLabel>
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-8">
            {STAPLE.map((item) => (<DishCard key={item.id} item={item} onAdd={addToCart} cat="staple" />))}
          </div>

          {/* 飲品 */}
          <SectionHeader zh="高原特色飲品" en="DRINK" />
          <SubgroupLabel>🍵 高原必喝</SubgroupLabel>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6">
            {DRINKS_MUST.map((item) => (<DishCard key={item.id} item={item} onAdd={addToCart} featuredLabel="必喝推薦" cat="drink" />))}
          </div>

          <SubgroupLabel>🥭 飯後最搭</SubgroupLabel>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-2">
            <DishCard item={LASSI_ITEM} onAdd={addToCart} cat="drink" />
          </div>
          <div className="rounded-lg px-3 py-2.5 mb-6 flex items-center gap-2" style={{ background: "var(--saffron)" }}>
            <Sparkles size={15} style={{ color: "var(--maroon-dark)" }} className="shrink-0" />
            <p className="text-xs font-semibold" style={{ color: "var(--maroon-dark)" }}>飯後也可以來份烤餅甜點：煉乳烤餅／朱古力烤餅（見上方烤餅區）。</p>
          </div>

          <SubgroupLabel>🥤 其他飲品</SubgroupLabel>
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
            {DRINKS_OTHER.map((item) => (
              <QuickAddChip key={item.id} name={item.name} price={item.price} onAdd={() => addToCart({ ...item, cat: "drink" })} />
            ))}
          </div>

        </div>
      )}

      {/* ================= 內場出單 ================= */}
      {tab === "kitchen" && (
        <div className="max-w-7xl mx-auto px-4 py-6">
          <div className="flex items-center justify-between mb-5">
            <h2 style={{ fontFamily: "var(--font-display)", color: "var(--maroon)" }} className="text-xl font-bold">內場出單看板（{activeOrders.length}）</h2>
            <button onClick={refresh} className="flex items-center gap-1.5 text-sm px-3 py-1.5 rounded-md border" style={{ borderColor: "var(--line)", color: "var(--ink)" }}>
              <RefreshCw size={14} /> 手動刷新
            </button>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-2">
            {activeOrders.map((o) => (
              <KitchenTicket key={o.id} o={o} elapsed={elapsedInfo(o.createdAt)} onToggleItem={toggleItemDone} onComplete={completeOrder} onPayment={setPayment} onDelete={removeOrder} onEdit={setEditingOrder} />
            ))}
          </div>
          {activeOrders.length === 0 && (
            <p className="text-sm opacity-40" style={{ color: "var(--ink)" }}>目前沒有進行中的訂單。</p>
          )}

          {servedOrders.length > 0 && (
            <>
              <h3 style={{ fontFamily: "var(--font-display)", color: "var(--maroon)" }} className="text-base font-semibold mb-3 mt-8 opacity-80">已出餐紀錄</h3>
              <div className="flex flex-wrap gap-2">
                {servedOrders.map((o) => (
                  <SwipeToDelete key={o.id} onDelete={() => removeOrder(o.id)} pill>
                    <span className="text-xs pl-2.5 pr-1.5 py-1 rounded-full border flex items-center" style={{ borderColor: "var(--line)", color: "var(--ink)", background: "var(--paper)" }}>
                      第{o.table}桌．{fmt(o.total)}．{o.payment === "unpaid" ? "未收款" : o.payment === "cash" ? "現金" : "轉帳"}
                    </span>
                  </SwipeToDelete>
                ))}
              </div>
            </>
          )}
        </div>
      )}

      {/* ================= 報表 ================= */}
      {tab === "report" && (
        <div className="max-w-4xl mx-auto px-4 py-6">
          <div className="flex items-center gap-3 mb-3 flex-wrap">
            <h2 style={{ fontFamily: "var(--font-display)", color: "var(--maroon)" }} className="text-xl font-bold">
              {{ day: "每日報表", week: "每週報表", month: "每月報表" }[reportPeriod]}
            </h2>
            <div className="flex rounded-md overflow-hidden border" style={{ borderColor: "var(--line)" }}>
              {[{ k: "day", label: "日" }, { k: "week", label: "週" }, { k: "month", label: "月" }].map(({ k, label }) => (
                <button
                  key={k}
                  onClick={() => setReportPeriod(k)}
                  className="px-3 py-1.5 text-sm font-medium"
                  style={{ background: reportPeriod === k ? "var(--maroon)" : "var(--paper)", color: reportPeriod === k ? "var(--paper)" : "var(--ink)" }}
                >
                  {label}
                </button>
              ))}
            </div>
            <input type="date" value={reportDate} onChange={(e) => setReportDate(e.target.value)} className="border rounded-md px-2 py-1.5 text-sm" style={{ borderColor: "var(--line)", fontFamily: "var(--font-mono)", background: "var(--paper)", color: "var(--ink)" }} />
          </div>
          <p className="text-xs mb-6 opacity-60" style={{ color: "var(--ink)", fontFamily: "var(--font-mono)" }}>
            {(() => {
              const [rs, re] = reportRange(reportDate, reportPeriod);
              return reportPeriod === "day" ? fmtShortDate(rs) : `${fmtShortDate(rs)} – ${fmtShortDate(re)}`;
            })()}
          </p>

          <div className="grid grid-cols-2 md:grid-cols-5 gap-4 mb-8">
            {[
              { label: reportPeriod === "day" ? "當日營業額" : reportPeriod === "week" ? "本週營業額" : "本月營業額", value: fmt(revenue) },
              { label: "訂單數", value: count },
              { label: "平均客單價", value: fmt(avgTicket) },
              { label: "未收款金額", value: fmt(byPayment.unpaid) },
              { label: "套餐加購率", value: `${comboAttachRate}%` },
            ].map((s) => (
              <div key={s.label} className="card p-4">
                <p className="text-xs opacity-60 mb-1" style={{ color: "var(--ink)" }}>{s.label}</p>
                <p style={{ fontFamily: "var(--font-mono)", color: "var(--maroon)" }} className="text-xl font-semibold">{s.value}</p>
              </div>
            ))}
          </div>

          <div className="grid md:grid-cols-2 gap-6">
            <div>
              <h3 style={{ fontFamily: "var(--font-display)", color: "var(--maroon)" }} className="text-base font-semibold mb-3">熱銷排行</h3>
              {topItems.length === 0 && <p className="text-sm opacity-60" style={{ color: "var(--ink)" }}>當日尚無訂單</p>}
              <div className="space-y-2">
                {topItems.map(([name, qty], idx) => (
                  <div key={name} className="flex items-center gap-3">
                    <span style={{ fontFamily: "var(--font-mono)", color: "var(--saffron)" }} className="text-sm w-5">{idx + 1}</span>
                    <span className="text-sm flex-1" style={{ color: "var(--ink)" }}>{name}</span>
                    <span style={{ fontFamily: "var(--font-mono)", color: "var(--ink)" }} className="text-sm">x{qty}</span>
                  </div>
                ))}
              </div>
            </div>

            <div>
              <h3 style={{ fontFamily: "var(--font-display)", color: "var(--maroon)" }} className="text-base font-semibold mb-3">付款方式分布</h3>
              {[{ k: "cash", label: "現金", color: "var(--juniper)" }, { k: "transfer", label: "轉帳", color: "var(--saffron)" }, { k: "unpaid", label: "未收款", color: "var(--maroon)" }].map(({ k, label, color }) => {
                const pct = revenue > 0 ? Math.round((byPayment[k] / (revenue || 1)) * 100) : 0;
                return (
                  <div key={k} className="mb-3">
                    <div className="flex justify-between text-sm mb-1" style={{ color: "var(--ink)" }}><span>{label}</span><span style={{ fontFamily: "var(--font-mono)" }}>{fmt(byPayment[k])}</span></div>
                    <div className="h-2 rounded-full" style={{ background: "#EFE1C0" }}><div className="h-2 rounded-full" style={{ width: `${pct}%`, background: color }} /></div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}

      {/* ================= 桌卡 QR ================= */}
      {tab === "qr" && <QrBoard />}
    </div>
  );
}

document.getElementById("boot-fallback")?.remove();
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>
</body>
</html>
